name: Player 2 Skill Factory CI

on:
  pull_request:
    paths:
      - "player2_skill_factory/**"
      - ".github/workflows/player2-skill-factory-ci.yml"
  push:
    branches:
      - player2-skill-factory-v4
    paths:
      - "player2_skill_factory/**"
      - ".github/workflows/player2-skill-factory-ci.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize backend
        run: python player2_skill_factory/player2_factory.py init
      - name: Generate skills
        run: python player2_skill_factory/player2_factory.py generate-skills
      - name: Score intent
        run: python player2_skill_factory/player2_factory.py score --intent "build next highest-value automation"
      - name: Trading research map
        run: python player2_skill_factory/player2_factory.py trading-map
      - name: Proof manifest
        run: python player2_skill_factory/player2_factory.py proof
      - name: Report
        run: python player2_skill_factory/player2_factory.py report
