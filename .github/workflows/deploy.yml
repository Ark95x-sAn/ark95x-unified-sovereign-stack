name: ARK95X Sovereign Deploy Pipeline

on:
  push:
    branches:
      - main
      - deploy
      - deploy/**
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: 'false'
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock
      - name: Run Pytest Suite
        id: pytest
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --junitxml=pytest-results.xml
        continue-on-error: true
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            pytest-results.xml
            coverage.xml
      - name: Evaluate Test Results
        if: ${{ github.event.inputs.force_deploy != 'true' }}
        run: |
          if [ "${{ steps.pytest.outcome }}" = "failure" ]; then
            echo "::error::Pytest failed"
            exit 1
          fi
        shell: bash

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped' || github.event.inputs.force_deploy == 'true') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

  deploy:
    name: Deploy to Self-Hosted Windows Runner
    runs-on: self-hosted
    needs: [build]
    environment:
      name: production
      url: ${{ steps.health.outputs.service_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Log in to Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Stop Existing Containers
        run: docker-compose -f docker-compose.yml down
        continue-on-error: true
      - name: Pull Latest Images
        run: docker pull ${{ needs.build.outputs.image_tag }}
      - name: Deploy with Docker Compose
        run: docker-compose -f docker-compose.yml up -d --force-recreate
        env:
          DOCKER_IMAGE: ${{ needs.build.outputs.image_tag }}
      - name: Wait for Startup
        run: Start-Sleep -Seconds 30
        shell: pwsh
      - name: Run Health Checks
        id: health
        shell: pwsh
        run: |
          $max = 10; $n = 0; $url = "http://localhost:8000/health"
          while ($n -lt $max) {
            try {
              $r = Invoke-RestMethod -Uri $url -TimeoutSec 5
              if ($r.status -eq "healthy") {
                Write-Host "Health check passed"
                echo "service_url=$url" >> $env:GITHUB_OUTPUT
                echo "health_status=healthy" >> $env:GITHUB_OUTPUT
                exit 0
              }
            } catch { $n++; Start-Sleep -Seconds 10 }
          }
          echo "health_status=unhealthy" >> $env:GITHUB_OUTPUT
          exit 1
      - name: Send n8n Webhook
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $payload = @{
            deployment = @{
              status = "${{ job.status }}"
              commit_sha = "${{ github.sha }}"
              branch = "${{ github.ref_name }}"
              author = "${{ github.event.head_commit.author.name }}"
              message = "${{ github.event.head_commit.message }}"
              timestamp = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
            }
            service = @{
              health_status = "${{ steps.health.outputs.health_status }}"
              service_url = "${{ steps.health.outputs.service_url }}"
              image_tag = "${{ needs.build.outputs.image_tag }}"
            }
            workflow = @{
              run_id = "${{ github.run_id }}"
              run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          } | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Uri "${{ secrets.N8N_WEBHOOK_URL }}" -Method POST -Body $payload -ContentType "application/json"

  rollback:
    name: Rollback on Failure
    runs-on: self-hosted
    needs: [deploy]
    if: failure()
    steps:
      - name: Restore Previous Deployment
        shell: pwsh
        run: |
          docker-compose -f docker-compose.yml down
          docker-compose -f docker-compose.yml up -d
      - name: Notify Rollback
        shell: pwsh
        continue-on-error: true
        run: |
          $payload = @{ deployment = @{ status = "rolled_back"; commit_sha = "${{ github.sha }}" } } | ConvertTo-Json
          Invoke-RestMethod -Uri "${{ secrets.N8N_WEBHOOK_URL }}" -Method POST -Body $payload -ContentType "application/json"
