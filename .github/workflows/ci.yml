name: ARK95X CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          if [ -d tests/ ]; then
            pytest tests/ -v --tb=short --cov=. --cov-report=term-missing || true
          else
            echo "No tests directory found - skipping"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install flake8
      - name: Check syntax
        run: flake8 . --max-line-length=120 --extend-ignore=E501,W503,E402,F401,E722,E127 --exclude=.git,__pycache__,venv,node_modules,.env

  docker:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ark95x-sovereign-stack .
          else
            echo "No Dockerfile found - skipping build"
          fi
      - name: Verify container starts
        run: |
          if [ -f Dockerfile ]; then
            docker run -d --name test-container -p 8000:8000 ark95x-sovereign-stack
            sleep 5
            curl -f http://localhost:8000/health || echo "Health check skipped"
            docker stop test-container || true
          fi
