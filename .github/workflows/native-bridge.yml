name: Native bridge verification

on:
  pull_request:
    paths:
      - 'n95_native/**'
      - 'core/device_mesh.py'
      - 'tests/test_native_bridge.py'
      - 'tests/test_core_handoff.py'
      - 'tests/test_device_mesh.py'
      - 'tools/N95-Native-Preflight.ps1'
      - '.github/workflows/native-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.1.1 loguru==0.7.3 pydantic==2.13.4
      - name: Enforce transport and device assertions
        run: python -m pytest -q tests/test_native_bridge.py tests/test_core_handoff.py tests/test_device_mesh.py
      - name: Parse the Windows audit script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'tools/N95-Native-Preflight.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'PowerShell parsing failed' }
