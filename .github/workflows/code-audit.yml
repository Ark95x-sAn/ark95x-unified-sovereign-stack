name: Emerald Tablet Code Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Code Audit Master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install audit tools
        run: |
          pip install pylint flake8 bandit mypy yamllint semgrep
          npm install -g eslint typescript
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin latest
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin latest
          sudo apt-get install -y shellcheck

      # === Layer 1: Static Analysis (advisory on PRs) ===
      - name: Layer 1 - reviewdog pylint
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pylint --recursive=y --output-format=text --score=no . 2>/dev/null | reviewdog -f=pylint -reporter=github-pr-review

      - name: Layer 1 - reviewdog flake8
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: flake8 . 2>/dev/null | reviewdog -f=flake8 -reporter=github-pr-review

      - name: Layer 1 - reviewdog shellcheck
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: find . -name '*.sh' -exec shellcheck -f gcc {} + 2>/dev/null | reviewdog -f=gcc -reporter=github-pr-review

      # === Layer 2: Security (HARD GATE - fails on HIGH) ===
      - name: Layer 2 - Bandit Security (HIGH severity gate)
        id: bandit
        continue-on-error: true
        run: bandit -r . -f txt -lll

      - name: Layer 2 - Semgrep SAST
        if: always()
        continue-on-error: true
        run: semgrep scan --config auto . --text

      # === Layer 3: Vulnerability Scan (HARD GATE - fails on HIGH/CRITICAL) ===
      - name: Layer 3 - Trivy Vuln Scan (HIGH/CRITICAL gate)
        id: trivy
        if: always()
        continue-on-error: true
        run: trivy fs . --severity HIGH,CRITICAL --exit-code 1

      # === Layer 4: Type Checking (advisory) ===
      - name: Layer 4 - MyPy Types
        if: always()
        continue-on-error: true
        run: mypy . --ignore-missing-imports

      - name: Audit Summary
        if: always()
        run: |
          echo "=== EMERALD TABLET AUDIT COMPLETE ==="
          echo "L1: Static (pylint/flake8/shellcheck) - advisory"
          echo "L2: Security (bandit=HARD GATE, semgrep=advisory)"
          echo "L3: Vulns (trivy=HARD GATE on HIGH/CRITICAL)"
          echo "L4: Types (mypy) - advisory"

      # === Enforce hard gates ===
      - name: Enforce Security Gates
        if: always()
        run: |
          if [ "${{ steps.bandit.outcome }}" = "failure" ]; then
            echo "BANDIT GATE FAILED: HIGH severity issues found"
            exit 1
          fi
          if [ "${{ steps.trivy.outcome }}" = "failure" ]; then
            echo "TRIVY GATE FAILED: HIGH/CRITICAL vulnerabilities found"
            exit 1
          fi
          echo "All security gates passed"
