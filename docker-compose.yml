version: '3.8'

services:
  ark95x-core:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - qdrant
      - mongodb
    volumes:
      - .:/app
    command: python main.py

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: ark95x
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    env_file: .env

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"

volumes:
  pgdata:
  mongodata:
  qdrantdata:
