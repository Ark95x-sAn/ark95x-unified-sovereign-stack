
networks:
  ark95x-net:
    driver: bridge
volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  qdrant-data:
  n8n-data:
services:
  # === CORE API (port 8000) ===
  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-core
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POSTGRES_URL=postgresql://ark95x:${POSTGRES_PASSWORD:-ark95x_pass}@postgres:5432/sovereign
      - MONGODB_URL=mongodb://mongodb:27017/ark95x
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - N8N_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ark95x-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # === COMMAND BASE DASHBOARD (port 8050) ===
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    environment:
      - DASHBOARD_PORT=8050
      - CORE_API_URL=http://core:8000
      - FLAMEGATE_URL=http://flamegate:8443
      - COMET_ROUTER_URL=http://comet-router:8100
      - GATE_UNLOCKER_URL=http://gate-unlocker:8200
    command: python -m command.dashboard
    depends_on:
      - core
    networks:
      - ark95x-net

  # === FLAMEGATE TLS PROXY (port 8443) ===
  flamegate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-flamegate
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - FLAMEGATE_PORT=8443
      - FLAMEGATE_ADMIN_TOKEN=${FLAMEGATE_ADMIN_TOKEN:-ark95x-sovereign-flame-token}
      - CORE_API_URL=http://core:8000
      - COMET_ROUTER_URL=http://comet-router:8100
      - GATE_UNLOCKER_URL=http://gate-unlocker:8200
    command: uvicorn flame.flamegate_tls:app --host 0.0.0.0 --port 8443
    depends_on:
      - core
    networks:
      - ark95x-net

  # === COMET ROUTER (port 8100) ===
  comet-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-comet-router
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - COMET_ROUTER_PORT=8100
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    command: uvicorn core.comet_router:app --host 0.0.0.0 --port 8100
    networks:
      - ark95x-net

  # === GATE UNLOCKER (port 8200) ===
  gate-unlocker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-gate-unlocker
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - GATE_UNLOCKER_PORT=8200
      - FLAMEGATE_ADMIN_TOKEN=${FLAMEGATE_ADMIN_TOKEN:-ark95x-sovereign-flame-token}
    command: uvicorn core.gate_unlocker:app --host 0.0.0.0 --port 8200
    networks:
      - ark95x-net

  # === MULTI-AGENT COUNCIL (port 8300) ===
  council:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-council
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      - COUNCIL_PORT=8300
      - OLLAMA_HOST=http://host.docker.internal:11434
      - COUNCIL_MODEL=${COUNCIL_MODEL:-llama3}
      - GATE_UNLOCKER_URL=http://gate-unlocker:8200
    command: uvicorn flame.council:app --host 0.0.0.0 --port 8300
    depends_on:
      - gate-unlocker
    networks:
      - ark95x-net

  # === SHADOW AGENT (port 8400) ===
  shadow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark95x-shadow-agent
    restart: unless-stopped
    ports:
      - "8400:8400"
    environment:
      - SHADOW_AGENT_PORT=8400
      - SHADOW_POLL_INTERVAL=10
      - CORE_API_URL=http://core:8000
      - FLAMEGATE_URL=http://flamegate:8443
      - COMET_ROUTER_URL=http://comet-router:8100
      - GATE_UNLOCKER_URL=http://gate-unlocker:8200
      - COUNCIL_URL=http://council:8300
    command: uvicorn core.shadow_agent:app --host 0.0.0.0 --port 8400
    depends_on:
      - core
    networks:
      - ark95x-net

  # === INFRASTRUCTURE SERVICES ===
  postgres:
    image: postgres:16-alpine
    container_name: ark95x-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ark95x
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ark95x_pass}
      POSTGRES_DB: sovereign
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ark95x-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark95x -d sovereign"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: ark95x-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - ark95x-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ark95x-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ark95x-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ark95x-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ark95x-net
    healthcheck:
      # qdrant's image ships no curl/wget; TCP-probe the port with bash instead.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: ark95x-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      # n8n v2 disables the Execute Command node by default (security
      # hardening: https://docs.n8n.io/2-0-breaking-changes/). This repo's
      # workflows/ark_failover_dispatch_v1.json still uses it for
      # Commit_Genome_Update (git add/commit/push), with a fixed,
      # non-interpolated command (no untrusted/webhook input reaches the
      # shell), so it's re-enabled here. The dispatch node itself
      # (Run_Failover_Router) was switched to an HTTP Request node against
      # the cockpit instead, precisely to avoid needing this.
      - NODES_EXCLUDE=[]
      # n8n v2 also blocks $env.* access from node expressions by default
      # (same security-hardening pass). workflows/ark_failover_dispatch_v1.json
      # reads $env.COCKPIT_URL to build the dispatch URL -- no secrets flow
      # through it, just a hostname -- so it's re-enabled here too.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Lets workflows/ark_failover_dispatch_v1.json's HTTP Request node
      # reach the cockpit running on the host (see extra_hosts below).
      # When the cockpit also runs in this compose network (not yet wired
      # up), point this at http://core:8000 or a dedicated cockpit service.
      - COCKPIT_URL=${COCKPIT_URL:-http://host.docker.internal:8080}
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=America/Chicago
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=ark95x
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-ark95x_pass}
      - N8N_ENCRYPTION_KEY=${N8N_API_KEY:-ark95x_n8n_encryption_key_32ch}
    volumes:
      - n8n-data:/home/node/.n8n
    extra_hosts:
      # Docker Desktop (Mac/Windows) resolves host.docker.internal
      # automatically; native Linux Docker Engine does not, so it's added
      # explicitly here (host-gateway is a special value Docker resolves
      # to the host's real IP on the bridge network).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ark95x-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678"]
      interval: 30s
      timeout: 10s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: ark95x-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    networks:
      - ark95x-net

  prometheus:
    image: prom/prometheus:latest
    container_name: ark95x-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ark95x-net

  grafana:
    image: grafana/grafana:latest
    container_name: ark95x-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ark95x_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - ark95x-net
