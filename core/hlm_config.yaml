# =============================================================
# ARK95X HLM Trinity Stack — Model Registry Configuration
# 27 AI models across 5 tiers + Obelisk 9R Brain Mapping
# =============================================================

meta:
  version: "1.0.0"
  stack: "ARK95X Unified Sovereign Stack"
  architecture: "HLM Trinity Stack"
  description: "Head (reasoning) · Lateral (parallel) · Motor (execution)"

# ----------------------------------------------------------
# HLM Tier Definitions
# ----------------------------------------------------------
hlm_tiers:
  head:
    description: "Reasoning and planning models — strategic cognition"
    models: [claude_pro, chatgpt_pro, grok_xai, perplexity_comet]
  lateral:
    description: "Parallel processing models — breadth and speed"
    models: [ollama_llama3, ollama_deepseek, ollama_mistral, ollama_phi, gpt4all, merlin, monica, searxng]
  motor:
    description: "Execution models — action and automation"
    models: [codex, ollama_codellama, crewai, n8n, copilot, manus, github, docker_conductor]

# ----------------------------------------------------------
# Obelisk 9R Brain Mapping
# ----------------------------------------------------------
obelisk_9r:
  analysis:
    description: "Deep analytical reasoning and auditing"
    primary: [claude_pro]
    secondary: [chatgpt_pro]
    preferred_variants:
      claude_pro: "claude-opus-4-20250514"
      chatgpt_pro: "gpt-4o"
  synthesis:
    description: "Combining information from multiple sources"
    primary: [chatgpt_pro]
    secondary: [claude_pro]
    preferred_variants:
      claude_pro: "claude-sonnet-4-20250514"
  strategy:
    description: "Strategic planning and decision-making"
    primary: [chatgpt_pro]
    secondary: [claude_pro]
    preferred_variants:
      chatgpt_pro: "o3"
      claude_pro: "claude-opus-4-20250514"
  creativity:
    description: "Creative generation, brainstorming, design"
    primary: [chatgpt_pro]
    secondary: [grok_xai]
  execution:
    description: "Code generation, deployment, automation"
    primary: [codex, crewai]
    secondary: [n8n]
  memory:
    description: "Knowledge storage, retrieval, graph operations"
    primary: [notion]
    secondary: [github]
  prediction:
    description: "Forecasting, research, trend analysis"
    primary: [perplexity_comet]
    secondary: [chatgpt_pro, grok_xai]
    preferred_variants:
      perplexity_comet: "deep_research"
      chatgpt_pro: "o3"
  communication:
    description: "Writing, drafting, messaging"
    primary: [chatgpt_pro]
    secondary: [claude_pro]
    preferred_variants:
      claude_pro: "claude-sonnet-4-20250514"
  integration:
    description: "System wiring, API connections, orchestration"
    primary: [claude_pro]
    secondary: [chatgpt_pro]
    preferred_variants:
      claude_pro: "claude-opus-4-20250514"
      chatgpt_pro: "o3"

# ----------------------------------------------------------
# Model Registry — 27 Models
# ----------------------------------------------------------
models:
  # --- TIER 1: Primary Command ---
  perplexity_comet:
    id: "perplexity_comet"
    name: "Perplexity Comet"
    tier: 1
    tier_name: "Primary Command"
    hlm_role: "head"
    endpoint: "https://api.perplexity.ai"
    modes: ["pro_search", "deep_research", "spaces"]
    api_key_env: "PERPLEXITY_API_KEY"
    capabilities: ["research", "search", "citation", "real_time_data"]
    max_tokens: 8192
    rate_limit_rpm: 60

  chatgpt_pro:
    id: "chatgpt_pro"
    name: "ChatGPT Pro"
    tier: 1
    tier_name: "Primary Command"
    hlm_role: "head"
    endpoint: "https://api.openai.com/v1"
    models: ["gpt-4o", "o1", "o3", "gpt-4o-mini"]
    default_model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    capabilities: ["reasoning", "coding", "analysis", "creativity", "strategy"]
    max_tokens: 128000
    rate_limit_rpm: 500

  claude_pro:
    id: "claude_pro"
    name: "Claude Pro"
    tier: 1
    tier_name: "Primary Command"
    hlm_role: "head"
    endpoint: "https://api.anthropic.com/v1"
    models: ["claude-sonnet-4-20250514", "claude-opus-4-20250514", "claude-haiku"]
    default_model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"
    capabilities: ["analysis", "coding", "integration", "long_context", "safety"]
    max_tokens: 200000
    rate_limit_rpm: 300

  codex:
    id: "codex"
    name: "OpenAI Codex"
    tier: 1
    tier_name: "Primary Command"
    hlm_role: "motor"
    endpoint: "https://api.openai.com/v1"
    models: ["codex"]
    default_model: "codex"
    api_key_env: "OPENAI_API_KEY"
    capabilities: ["code_generation", "code_review", "refactoring", "deployment"]
    max_tokens: 32000
    rate_limit_rpm: 200

  grok_xai:
    id: "grok_xai"
    name: "Grok (xAI)"
    tier: 1
    tier_name: "Primary Command"
