# ----------------------------------------------------------
# Flame Signature Validation
# ----------------------------------------------------------
flame_signatures:
  allowlist:
    - "sovereign"
    - "ark95x"
    - "flame_primary"
    - "flame_backup"
  default_dev: "sovereign"

# ----------------------------------------------------------
# Question Loop Templates
# ----------------------------------------------------------
question_loop:
  templates:
    - "Did this answer the actual question?"
    - "What was missed?"
    - "What adjacent insight exists?"
    - "Should this feed into the knowledge graph?"

# ----------------------------------------------------------
# Task Classification Patterns
# ----------------------------------------------------------
classification_patterns:
  execution:
    keywords: ["code", "build", "deploy", "fix", "implement", "run", "execute", "compile", "test", "debug", "push", "commit"]
    obelisk_function: "execution"
    hlm_tier: "motor"
  prediction:
    keywords: ["research", "find", "search", "compare", "forecast", "predict", "trend", "investigate", "discover"]
    obelisk_function: "prediction"
    hlm_tier: "lateral"
  strategy:
    keywords: ["plan", "strategy", "decide", "evaluate", "assess", "prioritize", "roadmap", "architect"]
    obelisk_function: "strategy"
    hlm_tier: "head"
  communication:
    keywords: ["write", "draft", "email", "communicate", "message", "respond", "compose", "announce"]
    obelisk_function: "communication"
    hlm_tier: "lateral"
  creativity:
    keywords: ["create", "design", "brainstorm", "imagine", "innovate", "generate", "invent", "concept"]
    obelisk_function: "creativity"
    hlm_tier: "head"
  analysis:
    keywords: ["analyze", "review", "audit", "check", "inspect", "examine", "diagnose", "assess"]
    obelisk_function: "analysis"
    hlm_tier: "head"
  synthesis:
    keywords: ["summarize", "combine", "merge", "synthesize", "consolidate", "aggregate", "unify"]
    obelisk_function: "synthesis"
    hlm_tier: "lateral"
  memory:
    keywords: ["remember", "store", "recall", "log", "archive", "save", "document", "record"]
    obelisk_function: "memory"
    hlm_tier: "motor"
  integration:
    keywords: ["connect", "integrate", "wire", "sync", "link", "bridge", "orchestrate", "pipeline"]
    obelisk_function: "integration"
    hlm_tier: "head"
